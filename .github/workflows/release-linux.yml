name: Build Linux AppImage

# Manual trigger only: Actions tab -> "Build Linux AppImage" -> Run workflow.
# Runs packaging/linux/build-appimage.sh and uploads the AppImage and update files as one artifact.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install vpk
        run: |
          # The packaging tool must match the Velopack library the app ships with.
          VELOPACK_VERSION=$(grep -oP '<PackageVersion Include="Velopack" Version="\K[^"]+' Directory.Packages.props)
          dotnet tool install --global vpk --version "$VELOPACK_VERSION"

      - name: Build and package AppImage
        run: |
          # Normalize line endings in case any packaging file was committed with CRLF
          sed -i 's/\r$//' packaging/linux/*.sh packaging/linux/*.desktop packaging/linux/*.xml
          chmod +x packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh

      - name: Read version
        id: version
        run: echo "version=$(grep -oP '<Version>\K[^<]+' Directory.Build.props | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage and update files
        uses: actions/upload-artifact@v7
        with:
          name: ArgoBooks-${{ steps.version.outputs.version }}-linux-x64
          path: |
            publish/ArgoBooks-*-linux-x64.AppImage
            publish/velopack/linux/
          if-no-files-found: error
